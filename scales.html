<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scales — Music Theory Trainer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <h1>🎹 Music Theory Trainer</h1>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="scales.html" class="active">Scales</a>
      <a href="chords.html">Chords</a>
      <a href="quiz.html">Quiz</a>
    </nav>
  </header>

  <main>
    <div class="panel">
      <div id="current-selection"></div>
      <div class="keyboard-scroll">
        <div id="keyboard-container"></div>
      </div>
    </div>

    <div class="panel">
      <div class="controls-row">
        <div class="controls-group">
          <h3>Root Note</h3>
          <div id="key-selector-container"></div>
        </div>
        <div class="controls-group">
          <h3>Mode</h3>
          <div id="mode-selector-container"></div>
        </div>
      </div>

      <div class="controls-row">
        <div class="controls-group">
          <h3>Transpose</h3>
          <div id="octave-transpose-container"></div>
        </div>
        <div class="controls-group">
          <h3>Keyboard Range</h3>
          <div id="range-control-container"></div>
        </div>
      </div>
    </div>
  </main>

  <footer>Scale root is highlighted with a red circle; the rest of the scale notes are highlighted blue.</footer>

  <script type="module" src="scales-page.js"></script>
</body>
</html>
